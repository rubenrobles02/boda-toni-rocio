<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR para imprimir · Toñi & Rocío</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f3ec; --paper-2:#fff; --ink:#34313b; --ink-soft:#736e7b;
    --accent:#6e5d9e; --accent-soft:#b3a6cf; --line:#e5ddd0;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:#eae3d7; color:var(--ink);
    font-family:"Figtree",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:2rem 1rem 4rem;
  }
  .controls{
    width:100%; max-width:26rem; background:var(--paper-2); border:1px solid var(--line);
    border-radius:12px; padding:1.2rem; margin-bottom:2rem;
  }
  .controls h1{ font-family:"Cormorant",serif; font-weight:500; font-size:1.4rem; margin:0 0 .3rem; }
  .controls p{ margin:0 0 1rem; font-size:.85rem; color:var(--ink-soft); }
  .controls label{ display:block; font-size:.8rem; font-weight:600; margin-bottom:.35rem; }
  .controls input{
    width:100%; padding:.6rem .7rem; border:1px solid var(--line); border-radius:8px;
    font:inherit; font-size:.9rem; margin-bottom:.8rem;
  }
  .controls button{
    width:100%; padding:.7rem; border:0; border-radius:8px; background:var(--accent);
    color:#fff; font-weight:600; font-size:.9rem; cursor:pointer;
  }

  /* ---- Tarjeta imprimible ---- */
  .card{
    width:340px; background:var(--paper-2); color:var(--ink);
    padding:38px 32px 32px; border-radius:4px; text-align:center;
    box-shadow:0 20px 50px rgba(52,49,59,.22);
  }
  .card__lead{
    font-size:.66rem; font-weight:600; letter-spacing:.32em; text-indent:.32em;
    text-transform:uppercase; color:var(--accent); margin:0 0 16px;
  }
  .card__names{
    font-family:"Cormorant",serif; font-weight:500; font-size:2.4rem; line-height:1;
    margin:0 0 6px;
  }
  .card__names .amp{ font-style:italic; color:var(--accent); margin:0 .14em; }
  .card__rule{ width:54px; height:1px; background:var(--accent-soft); margin:14px auto 16px; }
  .card__date{
    font-family:"Cormorant",serif; font-style:italic; font-size:1rem;
    color:var(--ink-soft); margin:0 0 22px;
  }
  .card__qr{
    width:224px; height:224px; margin:0 auto 18px; display:grid; place-items:center;
    background:#fff; padding:10px; border:1px solid var(--line); border-radius:4px;
  }
  .card__qr img, .card__qr canvas{ width:100%; height:100%; }
  .card__cta{ font-size:.76rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; margin:0 0 6px; }
  .card__hint{ font-size:.76rem; color:var(--ink-soft); margin:0; }

  @media print{
    body{ background:#fff; padding:0; }
    .controls{ display:none; }
    .card{ box-shadow:none; margin:0 auto; }
  }
</style>
</head>
<body>

<div class="controls">
  <h1>QR para imprimir</h1>
  <p>Pega aquí la dirección de tu web publicada en GitHub Pages y pulsa Generar. Luego imprime esta página (Ctrl/Cmd + P): saldrá solo la tarjeta.</p>
  <label for="url">Dirección de la web</label>
  <input type="url" id="url" placeholder="https://tuusuario.github.io/boda-toni-rocio/">
  <button id="gen" type="button">Generar QR</button>
</div>

<div class="card">
  <p class="card__lead">El álbum de los invitados</p>
  <p class="card__names">Toñi<span class="amp">&amp;</span>Rocío</p>
  <div class="card__rule"></div>
  <p class="card__date" id="cardDate">30 de agosto de 2026</p>
  <div class="card__qr" id="qr"></div>
  <p class="card__cta">Escanéame</p>
  <p class="card__hint">Sube tus fotos de la boda</p>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  (function () {
    var CFG = window.BODA_CONFIG || {};
    if (CFG.date) document.getElementById("cardDate").textContent = CFG.date;

    var qrBox = document.getElementById("qr");
    var urlInput = document.getElementById("url");
    var guess = location.href.replace(/\/qr\.html.*$/, "/");
    urlInput.value = guess;

    function draw(text) {
      qrBox.innerHTML = "";
      new QRCode(qrBox, {
        text: text,
        width: 400,
        height: 400,
        colorDark: "#34313b",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    document.getElementById("gen").addEventListener("click", function () {
      var v = urlInput.value.trim();
      if (v) draw(v);
    });

    draw(guess);
  })();
</script>
</body>
</html>
