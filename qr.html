<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR para imprimir · Toñi & Rocío</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#1f2e26; --paper:#f4ebda; --ink:#272219; --amber:#e7a33d; --rose:#dc9297;
    --muted:#7c8b81;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:#33403a; color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:2rem 1rem 4rem;
  }
  .controls{
    width:100%; max-width:26rem; background:var(--paper); border-radius:12px;
    padding:1.2rem; margin-bottom:2rem;
  }
  .controls h1{
    font-family:"Fraunces",serif; font-weight:400; font-size:1.3rem; margin:0 0 .3rem;
  }
  .controls p{ margin:0 0 1rem; font-size:.85rem; color:var(--muted); }
  .controls label{ display:block; font-size:.8rem; font-weight:600; margin-bottom:.35rem; }
  .controls input{
    width:100%; padding:.6rem .7rem; border:1px solid rgba(39,34,25,.25);
    border-radius:8px; font:inherit; font-size:.9rem; margin-bottom:.8rem;
  }
  .controls button{
    width:100%; padding:.7rem; border:0; border-radius:8px; background:var(--ink);
    color:var(--paper); font-weight:600; font-size:.9rem; cursor:pointer;
  }

  /* ---- Tarjeta imprimible ---- */
  .card{
    width:340px; background:var(--paper); color:var(--ink);
    padding:34px 30px 30px; border-radius:6px; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .card__lead{
    font-family:"DM Mono",monospace; font-size:.7rem; letter-spacing:.32em;
    text-transform:uppercase; color:var(--amber); margin:0 0 14px;
  }
  .card__names{
    font-family:"Fraunces",serif; font-weight:400; font-size:2.2rem; line-height:1;
    margin:0 0 4px;
  }
  .card__names .amp{ font-style:italic; color:var(--rose); margin:0 .18em; }
  .card__date{
    font-family:"Fraunces",serif; font-style:italic; font-size:.95rem;
    color:var(--muted); margin:0 0 22px;
  }
  .card__qr{
    width:220px; height:220px; margin:0 auto 18px; display:grid; place-items:center;
    background:#fff; padding:10px; border-radius:4px;
  }
  .card__qr img, .card__qr canvas{ width:100%; height:100%; }
  .card__cta{
    font-family:"DM Mono",monospace; font-size:.78rem; letter-spacing:.16em;
    text-transform:uppercase; margin:0 0 6px;
  }
  .card__hint{ font-size:.74rem; color:var(--muted); margin:0; }

  @media print{
    body{ background:#fff; padding:0; }
    .controls{ display:none; }
    .card{ box-shadow:none; margin:0 auto; }
  }
</style>
</head>
<body>

<div class="controls">
  <h1>QR para imprimir</h1>
  <p>Pega aquí la dirección de tu web publicada en GitHub Pages y pulsa Generar. Luego imprime esta página (Ctrl/Cmd + P): saldrá solo la tarjeta.</p>
  <label for="url">Dirección de la web</label>
  <input type="url" id="url" placeholder="https://tuusuario.github.io/boda-toni-rocio/">
  <button id="gen" type="button">Generar QR</button>
</div>

<div class="card">
  <p class="card__lead">La cámara de los invitados</p>
  <p class="card__names">Toñi<span class="amp">&amp;</span>Rocío</p>
  <p class="card__date" id="cardDate">30 de agosto de 2026</p>
  <div class="card__qr" id="qr"></div>
  <p class="card__cta">Escanéame</p>
  <p class="card__hint">Sube tus fotos de la boda</p>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  (function () {
    var CFG = window.BODA_CONFIG || {};
    if (CFG.date) document.getElementById("cardDate").textContent = CFG.date;

    var qrBox = document.getElementById("qr");
    var urlInput = document.getElementById("url");

    // valor por defecto: misma carpeta que este archivo, index.html
    var guess = location.href.replace(/\/qr\.html.*$/, "/");
    urlInput.value = guess;

    function draw(text) {
      qrBox.innerHTML = "";
      new QRCode(qrBox, {
        text: text,
        width: 400,
        height: 400,
        colorDark: "#272219",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    document.getElementById("gen").addEventListener("click", function () {
      var v = urlInput.value.trim();
      if (v) draw(v);
    });

    draw(guess);
  })();
</script>
</body>
</html>
